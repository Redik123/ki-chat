# Harnais de fuzzing du protocole — voir README.md de ce dossier.
#
# Un crate à part, hors de l'espace de travail : libFuzzer réclame la chaîne
# nightly et des drapeaux de compilation que le reste du projet n'a pas à
# connaître. `cargo build --workspace` ne le voit pas.
[package]
name = "ki-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
ki-protocol = { path = ".." }

[[bin]]
name = "texte"
path = "fuzz_targets/texte.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datagrammes"
path = "fuzz_targets/datagrammes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

# Le harnais est son propre espace de travail (voir en tête).
[workspace]
