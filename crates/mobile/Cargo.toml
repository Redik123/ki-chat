[package]
name = "ki-mobile"
version = "0.1.59"
edition = "2021"
license = "MIT"

# ki-chat sur téléphone (Android d'abord), avec Tauri 2 : le cœur Rust
# (QUIC, Opus, ki-voice) tourne en natif, l'interface est une page web.
#
# Espace de travail à part, exclu de celui de la racine : Tauri tire WebKitGTK
# sous Linux, que la CI du PC n'a pas, et la version PC ne doit rien en payer.
# Les crates partagées sont prises par chemin.
[workspace]

[lib]
name = "ki_mobile_lib"
# staticlib/cdylib : ce que charge l'appli Android ; rlib : le binaire PC
# (main.rs), qui permet d'essayer l'interface sans émulateur.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ki-protocol = { path = "../protocol" }
ki-client-quic = { path = "../client-quic" }
ki-voice = { path = "../voice" }
# Le cœur du client, partagé avec le PC : connexion, voix, état.
ki-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
bytes = "1"
tracing = "0.1"
# Les images et vidéos des salons, par HTTPS épinglé sur le serveur (comme
# le PC) : voir `media` dans lib.rs.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
urlencoding = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
# Les traces Rust dans logcat (balise « ki-chat »).
tracing-android = "0.2"

# iOS : ce que fait KiAndroid (Kotlin) côté Android, fait ici en Rust — voir
# ios.rs. Le Trousseau pour le mot de passe, la session audio pour le micro
# et le vocal écran éteint, les notifications locales.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSDictionary"] }
objc2-avf-audio = { version = "0.3", features = ["AVAudioSession", "AVAudioSessionTypes"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound", "block2"] }
block2 = "0.6"

[profile.dev.package."*"]
# Le DSP voix (Opus, RNNoise, Silero) doit tourner à vitesse réelle même en
# build debug, comme sur PC.
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
