<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ki-chat</title>
<style>
  :root {
    --fond: #0c0f14; --cote: #11151b; --base: #151a21; --releve: #1b212a;
    --survol: #242c37; --actif: #2d3744; --bord: #28313c; --bord-doux: #1e252e;
    --texte: #e7edf4; --doux: #94a2b2; --pale: #63707f;
    --accent: #00d26a; --parle: #00e676; --danger: #ff6b6b; --info: #58a6ff;
    --haut: env(safe-area-inset-top); --bas: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input, textarea { font: inherit; color: var(--texte); }
  svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .cache { display: none !important; }

  /* Écrans : un seul visible, plein cadre. */
  .ecran { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; padding-top: var(--haut); background: var(--fond); }
  .entete { display: flex; align-items: center; padding: 10px 14px; min-height: 54px; border-bottom: 1px solid var(--bord-doux); background: var(--cote); }
  .entete h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entete .sous { color: var(--pale); font-weight: 400; }
  .logo-serveur { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; flex: none; }
  .icone { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--doux); }
  .icone:active { background: var(--survol); }
  .defile { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #vue-salons, #vue-membres { background: var(--cote); }

  /* Connexion */
  #connexion .corps { flex: 1; align-self: center; overflow-y: auto; padding: 32px 20px calc(24px + var(--bas)); max-width: 440px; width: 100%; margin: 0 auto; }
  .marque { font-size: 30px; font-weight: 800; letter-spacing: -.5px; margin: 8px 0 4px; }
  .marque b { color: var(--accent); }
  .accroche { color: var(--doux); margin: 0 0 28px; }
  label { display: block; color: var(--doux); font-size: 13px; margin: 14px 0 6px; }
  .champ { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--bord); background: var(--base); font-size: 16px; outline: none; }
  .champ:focus { border-color: var(--accent); }
  .bouton { display: block; width: 100%; margin-top: 22px; padding: 14px; border-radius: 10px; background: var(--accent); color: #04140b; font-weight: 700; font-size: 16px; }
  .bouton:disabled { opacity: .5; }
  .lien { color: var(--info); font-size: 14px; margin-top: 16px; }
  .alerte { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: rgba(255,107,107,.12); color: var(--danger); font-size: 14px; }

  /* Listes */
  .titre-section { color: var(--pale); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 18px 16px 6px; }
  .ligne { display: flex; align-items: center; padding: 11px 16px; min-height: 48px; text-align: left; }
  .ligne:active { background: var(--survol); }
  .ligne .nom { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligne.non-lu .nom { font-weight: 700; color: var(--texte); }
  /* Le salon ouvert, comme sur PC : fond vert sombre, filet à gauche. */
  .ligne.actif { background: rgba(0,210,106,.12); box-shadow: inset 3px 0 var(--accent); }
  .ligne.actif .nom, .ligne.actif .diese { color: var(--accent); font-weight: 600; }
  .rang { font-size: 11px; font-weight: 600; margin-left: 6px; white-space: nowrap; }
  .couronne { width: 13px; height: 13px; color: var(--accent); margin-left: 5px; vertical-align: -1px; }
  .pastille-bot { display: inline-block; background: var(--accent); color: var(--fond); font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
  .occupant .qui-joue { color: var(--pale); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .occupant .bloc { flex: 1; min-width: 0; }
  .hors-ligne { opacity: .45; }
  .ligne .nom.calme { color: var(--doux); }
  .diese { color: var(--pale); font-weight: 700; width: 22px; text-align: center; }
  .pastille { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--actif); color: var(--texte); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .pastille.mention { background: var(--danger); color: #fff; }
  .vocal-ici { color: var(--accent); }
  .occupants { padding: 0 16px 6px 50px; }
  .occupant { display: flex; align-items: center; padding: 5px 0; color: var(--doux); font-size: 14px; }
  .petit { width: 16px; height: 16px; color: var(--pale); }

  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #0c0f14; flex: none; position: relative; }
  .avatar.mini { width: 24px; height: 24px; font-size: 11px; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .media { display: block; margin-top: 6px; max-width: min(100%, 360px); max-height: 320px; border-radius: 10px; background: var(--releve); }
  video.media { width: min(100%, 360px); }
  #visionneuse { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; }
  #visionneuse img { max-width: 100%; max-height: 100%; }
  .msg .texte-msg:active { background: var(--releve); border-radius: 6px; }
  .avatar.parle { box-shadow: 0 0 0 2px var(--fond), 0 0 0 4px var(--parle); }
  .avatar.absent { opacity: .4; }
  .membre-info { flex: 1; min-width: 0; }
  .membre-info .jeu { color: var(--pale); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Onglets du bas */
  .onglets { display: flex; border-top: 1px solid var(--bord-doux); background: var(--cote); padding-bottom: var(--bas); }
  .onglets button { flex: 1; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; color: var(--pale); font-size: 11px; font-weight: 600; position: relative; }
  .onglets button.actif { color: var(--accent); }
  .onglets .total { position: absolute; top: 4px; left: calc(50% + 6px); }

  /* Barre vocale */
  .barre-vocale { display: flex; align-items: center; padding: 8px 10px 8px 14px; background: var(--releve); border-top: 1px solid var(--bord); }
  .barre-vocale .ou { flex: 1; min-width: 0; }
  .barre-vocale .ou b { color: var(--accent); font-size: 13px; display: block; }
  .barre-vocale .ou span { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .rond { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--actif); color: var(--texte); }
  .rond.coupe { background: rgba(255,107,107,.18); color: var(--danger); }
  .rond.raccrocher { background: var(--danger); color: #fff; }

  /* Salon texte */
  #fil { padding: 8px 0 12px; }
  .msg { display: flex; padding: 6px 14px; }
  .msg.suite { padding-top: 1px; }
  .msg.suite .avatar { visibility: hidden; height: 0; }
  .msg.nomme { background: rgba(255,161,87,.08); box-shadow: inset 3px 0 0 #ffa157; }
  .msg .corps-msg { flex: 1; min-width: 0; }
  .msg .qui { font-weight: 700; font-size: 14px; }
  .msg .quand { color: var(--pale); font-size: 11px; margin-left: 6px; font-weight: 400; }
  .msg .texte { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg .texte code { background: var(--releve); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .msg .texte a { color: var(--info); }
  .msg .texte .mention { color: var(--accent); font-weight: 600; }
  .msg .modifie { color: var(--pale); font-size: 11px; }
  .citation { font-size: 13px; color: var(--doux); border-left: 2px solid var(--bord); padding-left: 8px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reactions { display: flex; flex-wrap: wrap; margin-top: 5px; }
  .reaction { padding: 2px 8px; border-radius: 12px; background: var(--releve); border: 1px solid var(--bord); font-size: 13px; }
  .reaction.moi { border-color: var(--accent); background: rgba(0,210,106,.12); }
  .separateur { display: flex; align-items: center; margin: 10px 14px; color: var(--danger); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .separateur::before, .separateur::after { content: ""; flex: 1; height: 1px; background: var(--danger); opacity: .5; }
  .plus-ancien { text-align: center; color: var(--pale); font-size: 12px; padding: 10px; }
  .vide { color: var(--pale); text-align: center; padding: 40px 20px; }

  .redaction { border-top: 1px solid var(--bord-doux); background: var(--cote); padding: 8px 10px calc(8px + var(--bas)); }
  .redaction .repond { display: flex; align-items: center; font-size: 13px; color: var(--doux); padding: 0 4px 6px; }
  .redaction .repond span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .redaction .zone { display: flex; align-items: flex-end; }
  .redaction textarea { flex: 1; resize: none; max-height: 120px; padding: 11px 14px; border-radius: 20px; border: 1px solid var(--bord); background: var(--base); outline: none; font-size: 16px; line-height: 1.35; }
  .envoyer { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #04140b; display: grid; place-items: center; }

  /* Feuilles (menus du bas) */
  .voile { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 20; }
  .feuille { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--releve); border-radius: 16px 16px 0 0; padding: 8px 0 calc(12px + var(--bas)); max-height: 80vh; overflow-y: auto; }
  .feuille .poignee { width: 36px; height: 4px; border-radius: 2px; background: var(--bord); margin: 4px auto 10px; }
  .feuille h2 { font-size: 16px; margin: 4px 16px 10px; }
  .feuille .action { display: flex; align-items: center; width: 100%; padding: 14px 18px; text-align: left; }
  .feuille .action:active { background: var(--survol); }
  .emojis { display: flex; justify-content: space-around; padding: 6px 10px 12px; border-bottom: 1px solid var(--bord); }
  .emojis button { font-size: 26px; width: 46px; height: 46px; border-radius: 50%; }
  .emojis button:active { background: var(--survol); }
  .volume { display: flex; align-items: center; padding: 8px 18px; }
  .volume .nom { flex: 1; min-width: 0; }
  .volume input { width: 45%; accent-color: var(--accent); }
  .reglage-volume { padding: 4px 18px 10px; }
  .reglage-volume .haut { display: flex; align-items: center; color: var(--doux); font-size: 13px; }
  .reglage-volume .haut span:first-child { flex: 1; }
  .reglage-volume input { width: 100%; accent-color: var(--accent); margin: 10px 0 4px; }
  .petit-bouton { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--bord); color: var(--doux); font-size: 13px; }
  .feuille .action.danger { color: var(--danger); }
  .feuille .separation { height: 1px; background: var(--bord); margin: 6px 0; }
  .feuille h2 .rang { font-size: 12px; }

  /* Réglages */
  #vue-reglages { padding-bottom: 24px; }
  .groupe { margin: 0 12px 12px; background: var(--base); border: 1px solid var(--bord-doux); border-radius: 12px; overflow: hidden; }
  .option { padding: 13px 14px; border-top: 1px solid var(--bord-doux); }
  .option:first-child { border-top: 0; }
  .option .ligne-option { display: flex; align-items: center; }
  .option .ligne-option > * + * { margin-left: 12px; }
  .option .libelle { flex: 1; min-width: 0; }
  .option .libelle small { display: block; color: var(--pale); font-size: 12px; margin-top: 2px; }
  .option input[type=range] { width: 100%; accent-color: var(--accent); margin-top: 10px; }
  .valeur { color: var(--doux); font-size: 13px; font-variant-numeric: tabular-nums; }
  .segments { display: flex; background: var(--fond); border-radius: 9px; padding: 3px; margin-top: 10px; }
  .segments button { flex: 1; padding: 8px 4px; border-radius: 7px; color: var(--doux); font-size: 13px; font-weight: 600; }
  .segments button.choisi { background: var(--actif); color: var(--texte); }
  .interrupteur { width: 46px; height: 28px; border-radius: 14px; background: var(--actif); position: relative; flex: none; transition: background .15s; }
  .interrupteur::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--doux); transition: transform .15s, background .15s; }
  .interrupteur.oui { background: rgba(0,210,106,.35); }
  .interrupteur.oui::after { transform: translateX(18px); background: var(--accent); }
  .jauge-micro { position: relative; height: 10px; border-radius: 5px; background: var(--fond); overflow: hidden; margin-top: 10px; }
  .jauge-micro .niveau { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: var(--pale); transform-origin: left; transform: scaleX(0); transition: transform .08s linear; }
  .jauge-micro .niveau.parle { background: var(--parle); }
  .jauge-micro .seuil { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--texte); opacity: .7; }
  .puce { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--actif); color: var(--doux); }
  .puce.ok { background: rgba(0,210,106,.15); color: var(--accent); }
  .puce.mal { background: rgba(255,107,107,.15); color: var(--danger); }
  .rangee-boutons { display: flex; flex-wrap: wrap; margin-top: 10px; }
  .rangee-boutons > * { margin: 0 8px 8px 0; }
  .petit-bouton.plein { background: var(--accent); color: var(--fond); border-color: var(--accent); font-weight: 700; }
  .ptt { flex: 1; padding: 12px; border-radius: 10px; background: var(--actif); font-weight: 700; user-select: none; -webkit-user-select: none; touch-action: none; }
  .ptt.tenu { background: var(--accent); color: var(--fond); }

  /* Bandeau */
  #bandeau { position: fixed; left: 12px; right: 12px; top: calc(var(--haut) + 62px); z-index: 30; padding: 11px 14px; border-radius: 10px; background: var(--actif); font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); transition: opacity .2s, transform .2s; }
  #bandeau.erreur { background: #3a1d22; color: #ffb4b4; }
  #bandeau.masque { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  #etat-reseau { background: #3b2a12; color: #ffc785; font-size: 13px; text-align: center; padding: 6px; }

  /* Les WebView d'avant la 84 ignorent « gap » dans les flexbox : les
     espacements passent par des marges. */
  .entete > * + * { margin-left: 10px; }
  .ligne > * + * { margin-left: 12px; }
  .occupant > * + * { margin-left: 10px; }
  .onglets button > * + * { margin-top: 3px; }
  /* Barre vocale */
  .barre-vocale > * + * { margin-left: 6px; }
  .msg > * + * { margin-left: 10px; }
  .reactions > * { margin: 0 5px 5px 0; }
  .separateur::before { margin-right: 8px; }
  .separateur::after { margin-left: 8px; }
  .redaction .repond > * + * { margin-left: 8px; }
  .redaction .zone > * + * { margin-left: 8px; }
  .feuille .action > svg { margin-right: 12px; }
  .volume > * + * { margin-left: 10px; }
</style>
</head>

<!-- Connexion -->
<section class="ecran" id="connexion">
  <div class="corps">
    <div class="marque">ki<b>·</b>chat</div>
    <p class="accroche">Ton groupe, dans la poche.</p>
    <label for="serveur">Serveur</label>
    <input class="champ" id="serveur" value="ts.baws.fun" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
    <label for="pseudo">Pseudo</label>
    <input class="champ" id="pseudo" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username">
    <label for="mdp">Mot de passe</label>
    <input class="champ" id="mdp" type="password" autocomplete="current-password">
    <div id="bloc-invitation" class="cache">
      <label for="invitation">Code d'invitation</label>
      <input class="champ" id="invitation" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="lien" id="montrer-invitation">Première connexion ? J'ai un code d'invitation</button>
    <button class="bouton" id="btn-connecter">Se connecter</button>
    <div class="alerte cache" id="erreur-connexion"></div>
  </div>
</section>

<!-- Accueil : salons et membres -->
<section class="ecran cache" id="accueil">
  <div class="entete">
    <img id="logo-serveur" class="logo-serveur cache" alt="">
    <h1 id="nom-serveur">ki-chat</h1>
  </div>
  <div id="etat-reseau" class="cache">Connexion perdue — reconnexion…</div>
  <div class="defile" id="vue-salons"></div>
  <div class="defile cache" id="vue-membres"></div>
  <div class="defile cache" id="vue-reglages"></div>
  <div class="barre-vocale cache" data-barre-vocale></div>
  <nav class="onglets">
    <button class="actif" data-onglet="salons"><svg><use href="#i-salons"/></svg>Salons<span class="pastille total cache" id="total-non-lus"></span></button>
    <button data-onglet="membres"><svg><use href="#i-membres"/></svg>Membres</button>
    <button data-onglet="reglages"><svg><use href="#i-reglages"/></svg>Réglages</button>
  </nav>
</section>

<!-- Un salon texte -->
<section class="ecran cache" id="salon">
  <div class="entete">
    <button class="icone" id="btn-retour" aria-label="Retour"><svg><use href="#i-retour"/></svg></button>
    <h1><span class="sous">#</span> <span id="nom-salon"></span></h1>
  </div>
  <div class="defile" id="defile-fil"><div id="fil"></div></div>
  <div class="barre-vocale cache" data-barre-vocale></div>
  <div class="redaction">
    <div class="repond cache" id="repond"><svg class="petit"><use href="#i-repondre"/></svg><span id="repond-a"></span><button class="icone" id="annuler-reponse" aria-label="Annuler la réponse"><svg class="petit"><use href="#i-fermer"/></svg></button></div>
    <div class="zone">
      <textarea id="saisie" rows="1" placeholder="Écrire un message" enterkeyhint="send"></textarea>
      <button class="envoyer" id="btn-envoyer" aria-label="Envoyer"><svg><use href="#i-envoyer"/></svg></button>
    </div>
  </div>
</section>

<div id="bandeau" class="masque"></div>
<div id="feuilles"></div>

<script>
  // Les WebView Android d'avant la 86 (téléphones jamais mis à jour,
  // émulateur Android 11) n'ont pas replaceChildren.
  if (!Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function (...noeuds) {
      this.textContent = "";
      this.append(...noeuds);
    };
  }
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = (id) => document.getElementById(id);

  let vue = null;          // dernier état reçu du Rust
  let filCourant = null;   // dernier fil reçu
  let onglet = "salons";
  let reponseA = null;     // { auteur_id, ts, auteur, texte }
  let edition = null;      // le message qu'on modifie
  let enConnexion = false;

  // ---------- petits outils ----------
  function retenir(cle, val) { try { localStorage.setItem(cle, val); } catch (_) {} }
  function relire(cle) { try { return localStorage.getItem(cle); } catch (_) { return null; } }
  function empreintes() { try { return JSON.parse(relire("empreintes") || "{}"); } catch (_) { return {}; } }

  function echapper(t) {
    return t.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Le gras, l'italique, le code, les liens et les mentions — le même
  // langage que sur PC, en plus simple.
  function miseEnForme(texte) {
    let h = echapper(texte);
    h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
    h = h.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/(^|\s)@([\p{L}\p{N}_.\-]+)/gu, '$1<span class="mention">@$2</span>');
    return h;
  }

  // Repli seulement : les couleurs viennent du Rust, calculées comme sur PC
  // (rôle, sinon hachage du pseudo dans la même palette).
  const teintes = ["#2dd48f", "#62a8ff", "#ffa95c", "#ff8ac4", "#ba92ff", "#2ad3dd", "#ffd863", "#ff7d7d"];
  function couleur(nom) {
    let h = 0;
    for (const b of new TextEncoder().encode(nom)) h = (Math.imul(h, 31) + b) >>> 0;
    return teintes[h % teintes.length];
  }
  function badgeRang(rang) {
    const r = document.createElement("span");
    r.className = "rang";
    r.textContent = rang.nom;
    r.style.color = rang.couleur;
    return r;
  }
  // Les photos de profil, reçues du Rust au fil de l'eau.
  const photos = {};
  listen("photo", (e) => {
    const [id, url] = e.payload;
    if (url) photos[id] = url; else delete photos[id];
    if (vue) { dessinerSalons(); dessinerMembres(); }
    if (filCourant) dessinerFil();
  });
  function avatar(nom, classes = "", teinte = null, id = null) {
    const a = document.createElement("div");
    a.className = "avatar " + classes;
    if (id != null && photos[id]) {
      const img = document.createElement("img");
      img.src = photos[id];
      img.alt = "";
      a.append(img);
      return a;
    }
    a.style.background = teinte || couleur(nom);
    a.textContent = [...nom][0]?.toUpperCase() || "?";
    return a;
  }
  function icone(nom, classe = "") {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    if (classe) s.setAttribute("class", classe);
    const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
    u.setAttribute("href", "#i-" + nom);
    s.append(u);
    return s;
  }
  function heure(ts) {
    const d = new Date(ts);
    const auj = new Date();
    const hm = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === auj.toDateString()) return hm;
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " " + hm;
  }

  let minuterieBandeau;
  function bandeau(texte, erreur = false) {
    const b = $("bandeau");
    b.textContent = texte;
    b.classList.toggle("erreur", erreur);
    b.classList.remove("masque");
    clearTimeout(minuterieBandeau);
    minuterieBandeau = setTimeout(() => b.classList.add("masque"), 3500);
  }

  function montrer(ecran) {
    for (const e of ["connexion", "accueil", "salon"]) $(e).classList.toggle("cache", e !== ecran);
    signalerRegard();
    invoke("tester_micro", { oui: ecran === "accueil" && onglet === "reglages" });
  }

  // ---------- connexion ----------
  $("serveur").value = relire("serveur") || $("serveur").value;
  $("pseudo").value = relire("pseudo") || "";
  $("montrer-invitation").onclick = () => {
    $("bloc-invitation").classList.remove("cache");
    $("montrer-invitation").classList.add("cache");
    $("invitation").focus();
  };

  function erreurConnexion(texte) {
    const e = $("erreur-connexion");
    e.textContent = texte;
    e.classList.toggle("cache", !texte);
  }

  $("btn-connecter").onclick = async () => {
    const serveur = $("serveur").value.trim();
    const pseudo = $("pseudo").value.trim();
    if (!serveur || !pseudo || !$("mdp").value) {
      erreurConnexion("Serveur, pseudo et mot de passe sont nécessaires.");
      return;
    }
    retenir("serveur", serveur);
    retenir("pseudo", pseudo);
    erreurConnexion("");
    enConnexion = true;
    $("btn-connecter").disabled = true;
    $("btn-connecter").textContent = "Connexion…";
    await invoke("connecter", {
      serveur, pseudo,
      motDePasse: $("mdp").value,
      invitation: $("invitation").value.trim() || null,
      // L'empreinte retenue pour ce serveur : un imposteur sera refusé.
      empreinte: empreintes()[serveur] || null,
    });
  };
  for (const id of ["serveur", "pseudo", "mdp", "invitation"]) {
    $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-connecter").click(); });
  }

  function finConnexionUi() {
    enConnexion = false;
    $("btn-connecter").disabled = false;
    $("btn-connecter").textContent = "Se connecter";
  }

  listen("empreinte", (e) => {
    const serveur = $("serveur").value.trim();
    const toutes = empreintes();
    toutes[serveur] = e.payload;
    retenir("empreintes", JSON.stringify(toutes));
  });
  listen("connecte", () => {
    finConnexionUi();
    $("mdp").value = "";
    $("etat-reseau").classList.add("cache");
    if (!$("connexion").classList.contains("cache")) montrer("accueil");
  });
  listen("coupe", () => $("etat-reseau").classList.remove("cache"));
  listen("fin", (e) => {
    finConnexionUi();
    montrer("connexion");
    erreurConnexion(e.payload || "");
    fermerFeuille();
  });

  function demanderDeconnexion() {
    ouvrirFeuille((f) => {
      f.append(titre("Se déconnecter de " + (vue?.serveur || "ce serveur") + " ?"));
      f.append(action("sortir", "Se déconnecter", () => { invoke("deconnecter"); }));
    });
  };

  // ---------- onglets ----------
  for (const b of document.querySelectorAll("[data-onglet]")) {
    b.onclick = () => {
      onglet = b.dataset.onglet;
      document.querySelectorAll("[data-onglet]").forEach((x) => x.classList.toggle("actif", x === b));
      $("vue-salons").classList.toggle("cache", onglet !== "salons");
      $("vue-membres").classList.toggle("cache", onglet !== "membres");
      $("vue-reglages").classList.toggle("cache", onglet !== "reglages");
      if (onglet === "reglages") dessinerReglages();
      // Le micro ne tourne hors vocal que le temps des réglages (jauge, essai).
      invoke("tester_micro", { oui: onglet === "reglages" });
    };
  }

  // ---------- la vue : salons, membres, vocal ----------
  listen("vue", (e) => {
    vue = e.payload;
    if (!vue.connecte && !enConnexion && vue.moi == null) return;
    $("nom-serveur").textContent = vue.serveur || "ki-chat";
    const total = $("total-non-lus");
    total.textContent = vue.total_non_lus > 99 ? "99+" : vue.total_non_lus;
    total.classList.toggle("cache", !vue.total_non_lus);
    dessinerSalons();
    dessinerMembres();
    dessinerBarreVocale();
    if (!$("salon").classList.contains("cache")) {
      const s = vue.salons.find((s) => s.id === vue.courant);
      $("nom-salon").textContent = s ? s.nom : "";
    }
    if (feuilleVocale) dessinerFeuilleVocale();
  });

  function dessinerSalons() {
    const racine = $("vue-salons");
    racine.replaceChildren();
    const textes = vue.salons.filter((s) => !s.vocal);
    const vocaux = vue.salons.filter((s) => s.vocal);
    if (textes.length) racine.append(section("Salons textuels"));
    for (const s of textes) {
      const l = document.createElement("button");
      l.className = "ligne" + (s.non_lus ? " non-lu" : "") + (s.id === vue.courant ? " actif" : "");
      l.style.width = "100%";
      const d = document.createElement("span");
      d.className = "diese"; d.textContent = "#";
      const n = document.createElement("span");
      n.className = "nom" + (s.non_lus ? "" : " calme"); n.textContent = s.nom;
      l.append(d, n);
      if (s.non_lus) {
        const p = document.createElement("span");
        p.className = "pastille" + (s.mention ? " mention" : "");
        p.textContent = s.non_lus > 99 ? "99+" : s.non_lus;
        l.append(p);
      }
      l.onclick = () => ouvrirSalon(s.id);
      racine.append(l);
    }
    if (vocaux.length) racine.append(section("Salons vocaux"));
    for (const s of vocaux) {
      const l = document.createElement("button");
      l.className = "ligne"; l.style.width = "100%";
      const ic = icone("haut-parleur", vue.vocal === s.id ? "vocal-ici" : "petit");
      const n = document.createElement("span");
      n.className = "nom" + (vue.vocal === s.id ? " vocal-ici" : " calme"); n.textContent = s.nom;
      l.append(ic, n);
      l.onclick = () => (vue.vocal === s.id ? ouvrirFeuilleVocale() : rejoindre(s.id));
      racine.append(l);
      if (s.occupants.length) {
        const o = document.createElement("div");
        o.className = "occupants";
        for (const p of s.occupants) o.append(occupant(p));
        racine.append(o);
      }
    }
    if (!textes.length && !vocaux.length) {
      const v = document.createElement("div");
      v.className = "vide"; v.textContent = "Aucun salon visible.";
      racine.append(v);
    }
  }

  function section(t) {
    const d = document.createElement("div");
    d.className = "titre-section"; d.textContent = t;
    return d;
  }

  function occupant(p) {
    const d = document.createElement("div");
    d.className = "occupant";
    d.onclick = (e) => { e.stopPropagation(); menuMembre(p.id); };
    d.append(avatar(p.nom, "mini" + (p.parle ? " parle" : ""), p.couleur, p.id));
    const bloc = document.createElement("div");
    bloc.className = "bloc";
    const n = document.createElement("div");
    const nom = document.createElement("span");
    nom.textContent = p.nom; nom.style.color = p.couleur;
    n.append(nom);
    if (p.rang) n.append(badgeRang(p.rang));
    bloc.append(n);
    if (p.jeu) { const j = document.createElement("div"); j.className = "qui-joue"; j.textContent = p.jeu; bloc.append(j); }
    d.append(bloc);
    if (p.mobile) d.append(icone("telephone", "petit"));
    if (p.muet) d.append(icone("micro-coupe", "petit"));
    return d;
  }

  function dessinerMembres() {
    const racine = $("vue-membres");
    racine.replaceChildren();
    const enLigne = vue.membres.filter((m) => m.en_ligne && !m.bot);
    const absents = vue.membres.filter((m) => !m.en_ligne && !m.bot);
    for (const [titreSection, liste] of [["En ligne — " + enLigne.length, enLigne], ["Hors ligne — " + absents.length, absents]]) {
      if (!liste.length) continue;
      racine.append(section(titreSection));
      for (const m of liste) {
        const l = document.createElement("div");
        l.className = "ligne";
        l.append(avatar(m.nom, m.en_ligne ? "" : "absent", m.couleur, m.id));
        const info = document.createElement("div");
        info.className = "membre-info";
        const n = document.createElement("div");
        n.className = "nom";
        const nom = document.createElement("span");
        nom.textContent = m.nom; nom.style.color = m.couleur;
        if (!m.en_ligne) nom.className = "hors-ligne";
        n.append(nom);
        if (m.admin) n.append(icone("couronne", "couronne"));
        if (m.rang) n.append(badgeRang(m.rang));
        info.append(n);
        const ou = m.jeu || (m.vocal != null ? "en vocal · " + (vue.salons.find((s) => s.id === m.vocal)?.nom || "") : "");
        if (ou) { const j = document.createElement("div"); j.className = "jeu"; j.textContent = ou; info.append(j); }
        l.append(info);
        if (m.mobile && m.en_ligne) l.append(icone("telephone", "petit"));
        l.onclick = () => menuMembre(m.id);
        racine.append(l);
      }
    }
  }

  // ---------- le vocal ----------
  async function rejoindre(salon, motDePasse = null) {
    try {
      await invoke("rejoindre_vocal", { salon, motDePasse });
    } catch (err) { bandeau(String(err), true); }
  }

  function dessinerBarreVocale() {
    const s = vue.vocal != null ? vue.salons.find((x) => x.id === vue.vocal) : null;
    for (const barre of document.querySelectorAll("[data-barre-vocale]")) {
      barre.classList.toggle("cache", !s);
      if (!s) continue;
      barre.replaceChildren();
      const ou = document.createElement("button");
      ou.className = "ou"; ou.style.textAlign = "left";
      ou.innerHTML = "<b>En vocal</b><span></span>";
      ou.querySelector("span").textContent = s.nom + " · " + s.occupants.length + " présent" + (s.occupants.length > 1 ? "s" : "");
      ou.onclick = ouvrirFeuilleVocale;
      const micro = document.createElement("button");
      micro.className = "rond" + (vue.muet ? " coupe" : "");
      micro.setAttribute("aria-label", vue.muet ? "Rouvrir le micro" : "Couper le micro");
      micro.append(icone(vue.muet ? "micro-coupe" : "micro"));
      micro.onclick = () => invoke("micro", { muet: !vue.muet });
      const casque = document.createElement("button");
      casque.className = "rond" + (vue.sourd ? " coupe" : "");
      casque.setAttribute("aria-label", vue.sourd ? "Rétablir le son" : "Couper le son");
      casque.append(icone(vue.sourd ? "casque-coupe" : "casque"));
      casque.onclick = () => invoke("sourdine", { sourd: !vue.sourd });
      const fin = document.createElement("button");
      fin.className = "rond raccrocher";
      fin.setAttribute("aria-label", "Quitter le vocal");
      fin.append(icone("raccrocher"));
      fin.onclick = () => { invoke("quitter_vocal"); fermerFeuille(); };
      if (reglages.mode === "ptt") {
        // La barre se redessine souvent (qui parle change) : l'état « tenu »
        // vit hors du bouton, et le relâcher s'écoute sur toute la page.
        const ptt = document.createElement("button");
        ptt.className = "ptt" + (pttTenu ? " tenu" : "");
        ptt.textContent = pttTenu ? "Tu parles…" : "Maintenir pour parler";
        ptt.addEventListener("pointerdown", (e) => { e.preventDefault(); tenirPtt(true); });
        ou.style.flex = "0 1 auto";
        barre.append(ou, ptt, micro, casque, fin);
      } else {
        barre.append(ou, micro, casque, fin);
      }
    }
  }

  // Appuyer pour parler.
  let pttTenu = false;
  function tenirPtt(oui) {
    if (pttTenu === oui) return;
    pttTenu = oui;
    invoke("parler", { oui });
    if (oui) navigator.vibrate?.(10);
    for (const b of document.querySelectorAll(".ptt")) {
      b.classList.toggle("tenu", oui);
      b.textContent = oui ? "Tu parles…" : "Maintenir pour parler";
    }
  }
  for (const ev of ["pointerup", "pointercancel"]) window.addEventListener(ev, () => tenirPtt(false));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) tenirPtt(false);
    // Appli en arrière-plan : plus d'essai de micro.
    invoke("tester_micro", { oui: !document.hidden && onglet === "reglages" && !$("accueil").classList.contains("cache") });
  });

  // Les volumes par personne, retenus sur le téléphone.
  function volumes() { try { return JSON.parse(relire("volumes") || "{}"); } catch (_) { return {}; } }
  function reglerVolume(id, gain) {
    const v = volumes(); v[id] = gain; retenir("volumes", JSON.stringify(v));
    invoke("volume_membre", { id, gain });
  }

  // ---------- le menu d'un membre (comme le clic sur un nom, sur PC) ----------
  function menuMembre(id) {
    const m = vue?.membres.find((x) => x.id === id);
    if (!m) return;
    const moi = id === vue.moi;
    ouvrirFeuille((f) => {
      const h = titre("");
      const nom = document.createElement("span");
      nom.textContent = m.nom; nom.style.color = m.couleur;
      h.append(nom);
      if (m.rang) h.append(badgeRang(m.rang));
      f.append(h);
      if (m.jeu) { const j = document.createElement("div"); j.className = "occupant"; j.style.padding = "0 18px 8px"; j.textContent = m.jeu; f.append(j); }

      if (!moi) {
        // Son volume, chez moi seulement.
        const bloc = document.createElement("div");
        bloc.className = "reglage-volume";
        const haut = document.createElement("div");
        haut.className = "haut";
        const lib = document.createElement("span"); lib.textContent = "Volume";
        const val = document.createElement("span");
        haut.append(lib, val);
        const r = document.createElement("input");
        r.type = "range"; r.min = 0; r.max = 200; r.step = 5;
        r.setAttribute("aria-label", "Volume de " + m.nom);
        const montrer = () => { val.textContent = r.value + " %"; };
        r.value = Math.round((volumes()[id] ?? 1) * 100); montrer();
        r.oninput = () => { montrer(); reglerVolume(id, r.value / 100); };
        const remise = document.createElement("button");
        remise.className = "petit-bouton"; remise.textContent = "Remettre à 100 %";
        remise.onclick = () => { r.value = 100; montrer(); reglerVolume(id, 1); };
        bloc.append(haut, r, remise);
        f.append(bloc);
        if (m.en_ligne && !m.bot) f.append(action("poke", "Poke", () => invoke("poke", { id })));
      }

      // Modération : seulement ce qui aboutira (permission et rang).
      const d = vue.droits;
      if (!moi && !m.bot && m.sous_moi && (d.couper || d.deplacer || d.expulser || d.bannir)) {
        const sep = document.createElement("div"); sep.className = "separation"; f.append(sep);
        if (d.couper) {
          f.append(action(m.force_muet ? "micro" : "micro-coupe", m.force_muet ? "Rendre le micro" : "Couper le micro",
            () => moderer(id, "muet"), !m.force_muet));
          f.append(action(m.force_sourd ? "casque" : "casque-coupe", m.force_sourd ? "Rendre l'écoute" : "Rendre sourd",
            () => moderer(id, "sourd"), !m.force_sourd));
        }
        if (d.deplacer && m.vocal != null) {
          f.append(action("deplacer", "Déplacer en vocal", () => menuDeplacer(m)));
        }
        if (d.expulser) {
          f.append(action("sortir", "Expulser", async () => {
            const motif = await demander({ question: "Expulser " + m.nom + " ?", champ: "Motif (facultatif)", bouton: "Expulser", danger: true });
            if (motif !== null) moderer(id, "expulser", { motif });
          }, true));
        }
        if (d.bannir) {
          f.append(action("interdit", "Bannir…", async () => {
            const motif = await demander({ question: "Bannir " + m.nom + " définitivement ?", champ: "Motif", bouton: "Bannir", danger: true });

  function menuDeplacer(m) {

    } catch (err) { bandeau(String(err), true); }

  let feuilleVocale = false;

  function dessinerFeuilleVocale() {

  listen("connecte", () => {

  listen("mot_de_passe_vocal", (e) => {

      champ: "Mot de passe du salon", secret: true, bouton: "Entrer",
    }).then((mdp) => { if (mdp) rejoindre(salon, mdp); });
  });

  // ---------- un salon texte ----------
  function ouvrirSalon(id) {
    reponseAnnulee();

    $("fil").replaceChildren();

  $("btn-retour").onclick = () => montrer("accueil");

  listen("fil", (e) => {
    const nouveau = e.payload;
    const defile = $("defile-fil");
    const enBas = defile.scrollHeight - defile.scrollTop - defile.clientHeight < 80;
    const memeSalon = filCourant && filCourant.salon === nouveau.salon;
    const hauteurAvant = defile.scrollHeight;
    const premierAvant = filCourant?.messages[0]?.ts;
    filCourant = nouveau;
    dessinerFil();
    // Une page d'historique arrivée en tête : la lecture ne bouge pas.
    if (memeSalon && premierAvant && nouveau.messages[0]?.ts < premierAvant) {
      defile.scrollTop += defile.scrollHeight - hauteurAvant;
    } else if (!memeSalon || enBas) {
      defile.scrollTop = defile.scrollHeight;
    }
    chargementEnCours = false;
    signalerRegard();
  });

  function dessinerFil() {
    const racine = $("fil");
    racine.replaceChildren();
    const f = filCourant;
    if (!f) return;
    if (!f.messages.length) {
      const v = document.createElement("div");
      v.className = "vide"; v.textContent = "Pas encore de message ici. Lance la conversation !";
      racine.append(v);
      return;
    }
    if (f.suite) {
      const p = document.createElement("div");
      p.className = "plus-ancien"; p.textContent = "Remonte pour voir les messages plus anciens";
      racine.append(p);
    }
    let precedent = null;
    let separateurPose = false;
    for (const m of f.messages) {
      if (!separateurPose && f.separateur != null && m.ts > f.separateur && m.auteur_id !== vue?.moi) {
        const s = document.createElement("div");
        s.className = "separateur"; s.textContent = "Nouveaux messages";
        racine.append(s);
        separateurPose = true;
        precedent = null;
      }
      const suite = precedent && precedent.auteur_id === m.auteur_id && m.ts - precedent.ts < 5 * 60 * 1000 && !m.reponse;
      racine.append(message(m, suite));
      precedent = m;
    }
  }

  // Un lien vers un fichier de notre serveur : image ou vidéo, montrée dans
  // le fil comme sur PC. Les autres liens restent des liens.
  const IMAGE = /\.(png|jpe?g|bmp|gif|webp)$/i;
  const VIDEO = /\.(mp4|mov|webm|mkv|m4v|avi)$/i;
  function medias(texte) {
    const origine = vue?.origine;
    if (!origine) return [];
    const trouves = [];
    for (const lien of texte.match(/https?:\/\/[^\s<]+/g) || []) {
      const net = lien.replace(/^http:/, "https:");
      if (!net.startsWith(origine + "/files/")) continue;
      const chemin = net.split(/[?#]/)[0];
      if (IMAGE.test(chemin)) trouves.push({ type: "image", url: net });
      else if (VIDEO.test(chemin)) trouves.push({ type: "video", url: net, poster: chemin.replace(/[^/]+$/, "poster.jpg") });
    }
    return trouves;
  }
  const viaRust = (url) => window.__TAURI__.core.convertFileSrc(url, "kimedia");
  function ouvrirImage(src) {
    const v = document.createElement("div");
    v.id = "visionneuse";
    const img = document.createElement("img");
    img.src = src;
    v.append(img);
    v.onclick = () => v.remove();
    document.body.append(v);
  }

  function message(m, suite) {
    const d = document.createElement("div");
    d.className = "msg" + (suite ? " suite" : "") + (m.me_nomme ? " nomme" : "");
    const av = avatar(m.auteur, "", m.couleur, m.auteur_id);
    if (!m.bot) av.onclick = () => menuMembre(m.auteur_id);
    d.append(av);
    const c = document.createElement("div");
    c.className = "corps-msg";
    if (!suite) {
      const q = document.createElement("div");
      q.className = "qui"; q.textContent = m.auteur; q.style.color = m.couleur;
      if (!m.bot) q.onclick = () => menuMembre(m.auteur_id);
      if (m.bot) { const b = document.createElement("span"); b.className = "pastille-bot"; b.textContent = "BOT"; q.append(b); }
      const t = document.createElement("span");
      t.className = "quand"; t.textContent = heure(m.ts);
      q.append(t);
      c.append(q);
    }
    if (m.reponse) {
      const r = document.createElement("div");
      r.className = "citation"; r.textContent = m.reponse[0] + " : " + m.reponse[1];
      c.append(r);
    }
    const t = document.createElement("div");
    t.className = "texte"; t.innerHTML = miseEnForme(m.texte);
    if (m.modifie) { const e = document.createElement("span"); e.className = "modifie"; e.textContent = " (modifié)"; t.append(e); }
    t.classList.add("texte-msg");
    c.append(t);
    for (const md of medias(m.texte)) {
      if (md.type === "image") {
        const img = document.createElement("img");
        img.className = "media";
        img.loading = "lazy";
        img.src = viaRust(md.url);
        img.alt = "image";
        img.onclick = (e) => { e.stopPropagation(); ouvrirImage(img.src); };
        c.append(img);
      } else {
        const v = document.createElement("video");
        v.className = "media";
        v.controls = true;
        v.preload = "metadata";
        v.poster = viaRust(md.poster);
        v.src = viaRust(md.url);
        v.onclick = (e) => e.stopPropagation();
        c.append(v);
      }
    }
    if (m.reactions.length) {
      const rs = document.createElement("div");
      rs.className = "reactions";
      for (const r of m.reactions) {
        const b = document.createElement("button");
        b.className = "reaction" + (r.moi ? " moi" : "");
        b.textContent = r.emoji + " " + r.nb;
        b.onclick = () => invoke("reagir", { auteur: m.auteur_id, ts: m.ts, emoji: r.emoji, on: !r.moi });
        rs.append(b);
      }
      c.append(rs);
    }
    d.append(c);
    // Toucher le texte ouvre le menu du message ; l'appui long aussi.
    t.onclick = (e) => { if (!e.target.closest("a")) menuMessage(m); };
    appuiLong(d, () => menuMessage(m));
    return d;
  }

  function appuiLong(el, faire) {
    let t;
    el.addEventListener("touchstart", () => { t = setTimeout(() => { navigator.vibrate?.(15); faire(); }, 450); }, { passive: true });
    for (const ev of ["touchend", "touchmove", "touchcancel"]) el.addEventListener(ev, () => clearTimeout(t), { passive: true });
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); faire(); });
  }

  const EMOJIS = ["👍", "❤️", "😂", "😮", "😢", "🔥"];
  function menuMessage(m) {
    ouvrirFeuille((f) => {
      const e = document.createElement("div");
      e.className = "emojis";
      for (const emoji of EMOJIS) {
        const b = document.createElement("button");
        b.textContent = emoji;
        const deja = m.reactions.find((r) => r.emoji === emoji)?.moi;
        b.onclick = () => { invoke("reagir", { auteur: m.auteur_id, ts: m.ts, emoji, on: !deja }); fermerFeuille(); };
        e.append(b);
      }
      f.append(e);
      f.append(action("repondre", "Répondre", () => {
        edition = null;
        reponseA = m;
        $("repond-a").textContent = "Réponse à " + m.auteur + " : " + m.texte;
        $("repond").classList.remove("cache");
        $("saisie").focus();
      }));
      const mien = m.auteur_id === vue?.moi;
      if (mien) {
        f.append(action("crayon", "Modifier", () => {
          reponseA = null;
          edition = m;
          $("repond-a").textContent = "Modification de ton message";
          $("repond").classList.remove("cache");
          saisie.value = m.texte;
          saisie.dispatchEvent(new Event("input"));
          saisie.focus();
        }));

      if (mien || vue?.droits.supprimer) {
        f.append(action("poubelle", "Supprimer", async () => {
          const ok = await demander({ question: "Supprimer ce message ?", bouton: "Supprimer", danger: true });
          if (ok) invoke("supprimer", { auteur: m.auteur_id, ts: m.ts });
        }, true));
      }
    });
  }
  function reponseAnnulee() {
    reponseA = null;
    if (edition) { edition = null; saisie.value = ""; saisie.style.height = "auto"; }
    $("repond").classList.add("cache");
  }
  $("annuler-reponse").onclick = reponseAnnulee;

  // Remonter le fil : la page d'avant, une à la fois.
  let chargementEnCours = false;
  $("defile-fil").addEventListener("scroll", () => {
    const d = $("defile-fil");
    if (d.scrollTop < 200 && filCourant?.suite && !chargementEnCours && filCourant.messages.length) {
      chargementEnCours = true;
      invoke("remonter");
    }
    signalerRegard();
  }, { passive: true });

  // Ce qui arrive dans le fil est « lu » si on le regarde vraiment.
  let regardSignale = null;
  function signalerRegard() {
    const d = $("defile-fil");
    const oui = document.visibilityState === "visible"
      && !$("salon").classList.contains("cache")
      && d.scrollHeight - d.scrollTop - d.clientHeight < 80;
    if (oui !== regardSignale) {
      regardSignale = oui;
      invoke("regarde", { oui });
    }
  }
  document.addEventListener("visibilitychange", signalerRegard);

  // Rédaction
  const saisie = $("saisie");
  saisie.addEventListener("input", () => {
    saisie.style.height = "auto";
    saisie.style.height = Math.min(saisie.scrollHeight, 120) + "px";
  });
  saisie.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyerMessage(); }
  });
  $("btn-envoyer").onclick = envoyerMessage;
  async function envoyerMessage() {
    const texte = saisie.value.trim();
    if (!texte) return;
    try {
      if (edition) {
        await invoke("modifier", { auteur: edition.auteur_id, ts: edition.ts, texte });
        edition = null;
      } else {
        await invoke("envoyer", { texte, reponse: reponseA ? [reponseA.auteur_id, reponseA.ts] : null });
      }
      saisie.value = "";
      saisie.style.height = "auto";
      reponseAnnulee();
      const d = $("defile-fil");
      d.scrollTop = d.scrollHeight;
    } catch (err) { bandeau(String(err), true); }
  }

  // ---------- réglages ----------
  const REGLAGES_DEFAUT = {
    mode: "voix", neuronal: true, sensibilite: 0.5, seuil: 0.02,
    bruit: 1, echo: true, gain_auto: true, gain_micro: 1, volume: 1,
    notifs: "tout",
  };
  let reglages = { ...REGLAGES_DEFAUT };
  try { Object.assign(reglages, JSON.parse(relire("reglages") || "{}")); } catch (_) {}

  function envoyerReglages() {
    retenir("reglages", JSON.stringify(reglages));

    if (vue) dessinerBarreVocale();

  // À chaque connexion : le moteur repart des réglages du téléphone.

  envoyerReglages();

  function groupe(titreGroupe) {
    $("vue-reglages").append(section(titreGroupe));
    const g = document.createElement("div");
    g.className = "groupe";
    $("vue-reglages").append(g);
    return g;
  }
  function option(g, libelle, aide = "") {
    const o = document.createElement("div");
    o.className = "option";
    const l = document.createElement("div");
    l.className = "ligne-option";
    const t = document.createElement("div");
    t.className = "libelle";
    t.textContent = libelle;
    if (aide) { const a = document.createElement("small"); a.textContent = aide; t.append(a); }
    l.append(t);
    o.append(l);
    g.append(o);
    return { o, l };
  }
  function interrupteur(g, libelle, aide, cle) {
    const { l } = option(g, libelle, aide);
    const b = document.createElement("button");
    b.className = "interrupteur" + (reglages[cle] ? " oui" : "");
    b.setAttribute("role", "switch");
    b.setAttribute("aria-checked", String(!!reglages[cle]));
    b.setAttribute("aria-label", libelle);
    b.onclick = () => { reglages[cle] = !reglages[cle]; envoyerReglages(); dessinerReglages(); };
    l.append(b);

      seg.append(b);
    }
    o.append(seg);
  }
  function curseur(g, libelle, aide, cle, min, max, pas, afficher) {
    const { o, l } = option(g, libelle, aide);
    const v = document.createElement("span");
    v.className = "valeur";
    l.append(v);
    const r = document.createElement("input");
    r.type = "range"; r.min = min; r.max = max; r.step = pas; r.value = reglages[cle];
    r.setAttribute("aria-label", libelle);
    const montrer = () => { v.textContent = afficher(Number(r.value)); };
    montrer();
    r.oninput = () => { reglages[cle] = Number(r.value); montrer(); envoyerReglages(); };
    o.append(r);

  let elementsAudio = null;

        (x) => Math.round(x * 1000) / 10 + " %");

    const sortie = groupe("Son");

      (x) => Math.round(x * 100) + " %");

    const compte = groupe("Compte");

  }

  // La jauge et l'essai suivent le moteur, dix fois par seconde, tant que
  // l'onglet est affiché.
  setInterval(async () => {
    if (onglet !== "reglages" || $("accueil").classList.contains("cache") || !elementsAudio) return;
    let a;
    try { a = await invoke("etat_audio"); } catch (_) { return; }
    const e = elementsAudio;
    // Échelle douce : les voix vivent en bas de l'échelle.
    const echelle = (x) => Math.min(1, Math.sqrt(Math.max(0, x)) * 1.6);
    e.niveau.style.transform = "scaleX(" + echelle(a.niveau) + ")";
    e.niveau.classList.toggle("parle", a.emet || a.ouvert);
    e.seuil.style.left = (echelle(reglages.mode === "voix" ? reglages.seuil : 0) * 100) + "%";
    e.seuil.style.display = reglages.mode === "voix" ? "" : "none";
    const silero = !a.actif ? ["Micro en démarrage", ""]
      : reglages.mode !== "voix" || !reglages.neuronal ? ["Silero coupé", ""]
      : a.silero === "pret" ? ["Silero actif · " + Math.round(a.parole * 100) + " %", "ok"]
      : a.silero === "chargement" ? ["Silero se charge…", ""]
      : a.silero === "echec" ? ["Silero en panne", "mal"]
      : ["Silero en attente", ""];
    e.etatSilero.textContent = a.micro_sature ? "Micro saturé" : silero[0];
    e.etatSilero.className = "puce " + (a.micro_sature ? "mal" : silero[1]);

    // L'essai : les boutons ne changent qu'avec l'état.
    const cle = a.essai.etat + "|" + (a.essai.lecture || "") + "|" + a.actif;
    if (cle !== e.dernierEssai) {
      e.dernierEssai = cle;

        const b = document.createElement("button");

        e.boutonsEssai.append(b);
      };

      else bouton(a.essai.etat === "pret" ? "Recommencer" : "Enregistrer 5 s", "enregistrer", a.essai.etat !== "pret");
      if (a.essai.etat === "pret") {

        else {
          bouton("Ce que les autres entendent", "envoyee", true);
          bouton("Micro brut", "brute");
        }
      }
    }
    e.texteEssai.textContent =
      a.essai.etat === "enregistre" ? "Parle normalement… " + Math.round(a.essai.avancement * 100) + " %"
      : a.essai.lecture ? "Lecture… " + Math.round(a.essai.avancement * 100) + " %"
      : a.essai.etat === "pret" && a.essai.ecart_db != null
        ? (Math.abs(a.essai.ecart_db) < 3 ? "Ta voix arrive au bon volume chez les autres."
          : a.essai.ecart_db > 0 ? "Ta voix arrive " + Math.round(a.essai.ecart_db) + " dB plus fort que la moyenne."
          : "Ta voix arrive " + Math.round(-a.essai.ecart_db) + " dB plus bas que la moyenne.")
      : !a.actif ? "Le micro démarre…" : "";
  }, 100);

  // ---------- feuilles du bas ----------
  let quandFerme = null;
  function ouvrirFeuille(remplir, fermeture = null) {
    fermerFeuille();
    quandFerme = fermeture;
    const voile = document.createElement("div");
    voile.className = "voile";
    voile.onclick = fermerFeuille;
    const f = document.createElement("div");
    f.className = "feuille";
    f.innerHTML = '<div class="poignee"></div><div class="contenu"></div>';
    $("feuilles").replaceChildren(voile, f);
    remplir(f.querySelector(".contenu"));
  }
  function fermerFeuille() {
    $("feuilles").replaceChildren();
    if (quandFerme) { const q = quandFerme; quandFerme = null; q(); }
  }
  function titre(t) { const h = document.createElement("h2"); h.textContent = t; return h; }

  // Une question dans une feuille : un champ (ou aucun) et un bouton. Les
  // prompt()/confirm() du navigateur ne sont pas garantis dans la WebView.
  function demander({ question, champ = null, secret = false, bouton = "Valider", danger = false }) {
    return new Promise((resoudre) => {
      let repondu = false;
      ouvrirFeuille((f) => {
        f.append(titre(question));
        let saisie = null;
        if (champ !== null) {
          saisie = document.createElement("input");
          saisie.className = "champ";
          saisie.type = secret ? "password" : "text";
          saisie.placeholder = champ;
          saisie.style.cssText = "width: calc(100% - 36px); margin: 4px 18px 0;";
          f.append(saisie);
          setTimeout(() => saisie.focus(), 50);
        }
        const ok = document.createElement("button");
        ok.className = "bouton";
        ok.style.cssText = "width: calc(100% - 36px); margin: 16px 18px 6px;" + (danger ? "background: var(--danger); color: #fff;" : "");
        ok.textContent = bouton;
        ok.onclick = () => { repondu = true; resoudre(saisie ? saisie.value : true); fermerFeuille(); };
        if (saisie) saisie.addEventListener("keydown", (e) => { if (e.key === "Enter") ok.click(); });
        f.append(ok);
      }, () => { if (!repondu) resoudre(null); });
    });
  }
  function action(ic, libelle, faire, danger = false) {
    const b = document.createElement("button");
    b.className = "action" + (danger ? " danger" : "");
    b.append(icone(ic));
    b.append(document.createTextNode(libelle));
    b.onclick = () => { fermerFeuille(); faire(); };
    return b;
  }

  // Le bouton « retour » d'Android : feuille, puis salon, puis rien.
  history.pushState(null, "");
  window.addEventListener("popstate", () => {
    if ($("feuilles").childElementCount) fermerFeuille();
    else if (!$("salon").classList.contains("cache")) montrer("accueil");
    history.pushState(null, "");
  });

  // ---------- événements ponctuels ----------
  // Le logo du serveur, à côté de son nom, comme sur PC.
  listen("logo", (e) => {
    const img = $("logo-serveur");
    if (e.payload) img.src = e.payload;
    img.classList.toggle("cache", !e.payload);
  });
  listen("fin", () => $("logo-serveur").classList.add("cache"));
  listen("info", (e) => bandeau(e.payload));
  listen("erreur", (e) => bandeau(e.payload, true));
  listen("poke", (e) => { navigator.vibrate?.([80, 60, 80]); bandeau(e.payload + " te poke !"); });
  listen("prevenir", (e) => {
    const [salon, mention] = e.payload;
    if (reglages.notifs === "rien" || (reglages.notifs === "mentions" && !mention)) return;
    const lu = !$("salon").classList.contains("cache") && vue?.courant === salon && document.visibilityState === "visible";
    if (mention || !lu) navigator.vibrate?.(mention ? [60, 40, 60] : 30);
  });
</script>
</body>
</html>
