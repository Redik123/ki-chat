[package]
name = "ki-voice"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ki-protocol = { path = "../protocol" }
# Les datagrammes voix arrivent en `Bytes` (compteur de références) : les
# recopier pour traverser un canal serait une allocation par paquet, cinquante
# fois par seconde et par locuteur, pour rien.
bytes = "1"
anyhow.workspace = true
tracing.workspace = true
chacha20poly1305 = "0.10"
# Tirage du compteur de départ, qui sert de nonce : il doit être imprévisible
# et surtout ne jamais se répéter sous une même clé.
rand = "0.9"
cpal = "0.16"
dasp_sample = "0.11"
# Suppression de bruit RNNoise, port Rust pur (mode léger).
nnnoiseless = "0.5"
# Décodage WAV des effets sonores : pur Rust, et déjà dans l'arbre via
# nnnoiseless — l'exiger directement ne compile donc rien de neuf.
hound = "3.5"
# Suppression de bruit DeepFilterNet3 (mode studio) : réseau de neurones,
# inférence tract 100 % Rust, modèle embarqué dans le binaire (~2 Mo).
# La version crates.io est obsolète : dépendance git épinglée sur le tag.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# Bindings maison libopus 1.6 : DRED + Deep PLC (le crate `opus` public
# est figé sur libopus 1.3.1, sans les fonctions neuronales).
ki-opus = { path = "../ki-opus" }

# Moteur audio Windows natif (WASAPI direct) : rôle communication, conversion
# de format déléguée à Windows, notifications de périphériques, mode brut —
# tout ce que cpal ne demande pas et qui fait la robustesse de Discord face
# aux jeux. Même version que la GUI pour ne compiler le crate qu'une fois.
[target.'cfg(windows)'.dependencies]
# Le macro #[implement] émet des chemins ::windows_core : sans cette
# dépendance directe, ils résoudraient vers le windows-core 0.54 de cpal.
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    # Docteur audio : énumération des processus (suites qui s'interposent) et
    # lecture — jamais écriture — du réglage de mode exclusif.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Variant",
    "Win32_Devices_Properties",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "moteur"
harness = false
