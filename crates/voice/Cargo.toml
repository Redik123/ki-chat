[package]
name = "ki-voice"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ki-protocol = { path = "../protocol" }
anyhow.workspace = true
tracing.workspace = true
chacha20poly1305 = "0.10"
cpal = "0.16"
dasp_sample = "0.11"
# Suppression de bruit RNNoise, port Rust pur (mode léger).
nnnoiseless = "0.5"
# Décodage WAV des effets sonores : pur Rust, et déjà dans l'arbre via
# nnnoiseless — l'exiger directement ne compile donc rien de neuf.
hound = "3.5"
# Suppression de bruit DeepFilterNet3 (mode studio) : réseau de neurones,
# inférence tract 100 % Rust, modèle embarqué dans le binaire (~2 Mo).
# La version crates.io est obsolète : dépendance git épinglée sur le tag.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# Bindings maison libopus 1.6 : DRED + Deep PLC (le crate `opus` public
# est figé sur libopus 1.3.1, sans les fonctions neuronales).
ki-opus = { path = "../ki-opus" }
