[package]
name = "ki-client-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ki-chat"
path = "src/main.rs"

[features]
# Compteur d'allocations par image (`perf.rs`). Hors drapeau par défaut, et
# ce n'est pas de la timidité : une incrémentation atomique par allocation,
# sur une ligne de cache que se disputent le fil de l'interface, celui du
# réseau et CELUI DE L'AUDIO, coûte précisément là où il ne faut pas.
# `cargo run -p ki-client-gui --features mesures` quand on veut le chiffre.
mesures = []

[dependencies]
ki-protocol = { path = "../protocol" }
ki-voice = { path = "../voice" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Depuis 0.34, eframe ne fait plus tourner l'interface d'une fenêtre
# réduite (seulement `App::logic`), et repousse ses réveils d'au moins
# 100 ms : le push-to-talk est donc lu par le moteur vocal, l'overlay a son
# veilleur et le stream détaché sa propre fenêtre.
#
# Le rendu reste en OpenGL (glow), alors que 0.34 prend wgpu par défaut :
# changer de moteur de rendu se fera à part, essayé pour lui-même —
# l'overlay découpé, les streams et la reprise après un pilote
# réinitialisé en dépendent. Les options par défaut retirées ne servaient
# qu'à Linux (x11, wayland) et au web ; `links` ouvre les liens du chat.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "persistence"] }
# Le spectre de la voix derrière la courbe de l'égaliseur (page Casque). Déjà
# compilé pour le débruitage : la même version, rien de plus à télécharger.
realfft = "3.5"
# Chiffrement des trames du partage d'écran (clé de stream, en-tête en AAD).
chacha20poly1305 = "0.10"
ki-client-quic = { path = "../client-quic" }
# La connexion et la voix, partagées avec l'appli mobile.
ki-core = { path = "../core" }
# Les datagrammes voix voyagent en `Bytes` du transport jusqu'au moteur,
# sans jamais être recopiés.
bytes = "1"
ki-video = { path = "../video" }
# Le décodeur de la visionneuse (vidéos du chat) : Media Foundation sous Windows.
# Et celui des streams regardés, sur la carte graphique quand elle sait.
ki-media = { path = "../media" }
# L'image décodée d'un stream passe à egui sans être recopiée (`cast_vec`) :
# déjà dans l'arbre par egui, avec la même option.
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
tokio.workspace = true
chrono = "0.4"
# Le Loupedeck Live, piloté directement (boutons, molettes, écrans) ; ses
# écrans sont dessinés ici, avec les polices d'egui. ab_glyph n'est plus
# tiré que pour eux : egui l'a remplacé par skrifa en 0.34.
ki-loupedeck = { path = "../loupedeck" }
# La boîte à outils d'interface : jetons de design, mise en page flexbox.
ki-ui = { path = "../ui" }
ab_glyph = "0.2"
epaint_default_fonts = "0.36"
# Poll clavier global (GetAsyncKeyState) : le push-to-talk fonctionne
# même quand la fenêtre n'a pas le focus — indispensable en jeu.
device_query = "2"
# Dialogue natif de sélection de fichier (partage de fichiers).
rfd = "0.15"
# Client HTTP bloquant pour l'upload de fichiers.
ureq = { version = "2", features = ["json"] }
# Lire le presse-papiers pour « Coller » au clic droit : egui ne le lit
# que sur Ctrl+V.
arboard = "3"
# Logos de serveurs : décodage PNG/JPEG puis réencodage en vignette PNG.
# Les deux formats sont déjà tirés par eframe, aucun téléchargement en plus.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Le QR code du lien téléphone (atelier des clips) : la matrice seule, que
# l'on dessine nous-mêmes.
qrcode = { version = "0.14", default-features = false }
base64 = "0.22"
# Vérification de la signature des mises à jour. 100 % Rust, pas de
# dépendance C : l'application remplace son propre exécutable, c'est le seul
# endroit du projet où une bibliothèque de cryptographie tierce serait un
# risque plus grand que ce qu'elle protège.
# `std` : sans lui, l'erreur du crate n'implémente pas `std::error::Error`
# et ne remonte pas par `?`. On ne prend rien d'autre — ni signature, ni
# génération de clés : ce binaire ne fait que vérifier.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# L'empreinte de l'actif que le manifeste de mise à jour annonce : déjà dans
# l'arbre (ed25519-dalek s'en sert).
sha2 = "0.10"
# Le trait `HasWindowHandle`, que `eframe::Frame` et `CreationContext`
# implémentent : c'est par lui qu'on obtient le HWND de la fenêtre
# principale (réduction dans la zone de notification, sonde zone_probe).
# eframe ne le réexporte pas ; même version 0.6 que la sienne, déjà dans
# l'arbre.
raw-window-handle = "0.6"

# Icône, bloc de version et manifeste gravés dans l'exécutable (voir build.rs) ;
# sur macOS, le même dessin rendu en PNG pour l'icône du paquet.
[build-dependencies]
winresource = "0.1"
png = "0.18"

# macOS : la mise à jour remplace le paquet `.app` entier, livré archivé.
# flate2 et tar sont déjà dans l'arbre (scripts de build de ki-opus) :
# rien de plus à télécharger ni à auditer.
[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
tar = "0.4"
# Le Trousseau (Security.framework) : il garde la clé du coffre à secrets.
security-framework = "3"

# L'icône de la zone de notification (« réduire dans la zone » au lieu de
# fermer) et son menu Ouvrir / Quitter. Sans les features par défaut : elles
# ne servent qu'à Linux (GTK 3, libappindicator sous LGPL), et la
# dépendance est déclarée pour Windows et macOS seulement afin que
# cargo-deny, qui résout aussi la cible Linux, ne voie jamais ces licences.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

# Coffre à secrets natif : DPAPI protège les mots de passe mémorisés avec
# une clé dérivée de la session Windows. Déjà tiré par eframe.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    # SetThreadExecutionState : pas de veille système en plein salon vocal.
    "Win32_System_Power",
    # SHQueryUserNotificationState : un jeu en plein écran exclusif ? Alors
    # l'overlay ne peut pas s'afficher, et on le dit au lieu de laisser croire.
    "Win32_UI_Shell",
    # SetWindowPos(HWND_TOPMOST) : l'overlay se remet au-dessus des jeux qui
    # se remettent eux-mêmes au-dessus ; GetForegroundWindow : qui est devant.
    "Win32_UI_WindowsAndMessaging",
    # GetPixel : la sonde de transparence de l'overlay (exemple overlay_probe)
    # lit ce que l'écran affiche vraiment ; Dwm et Controls pour la
    # transparence par le compositeur (DwmExtendFrameIntoClientArea, MARGINS).
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    # GetDiskFreeSpaceExW : l'enregistreur de clips vérifie la place avant d'écrire.
    "Win32_Storage_FileSystem",
    # RegisterHotKey + la file de messages d'un fil : le raccourci des clips
    # tenu par Windows, qui passe au-dessus du jeu (raccourci.rs).
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    # GetProcessMemoryInfo, GlobalMemoryStatusEx : la mémoire de ki-chat et
    # celle qui reste au PC, dans le bilan du spectateur — pour voir, si un
    # PC gèle en plein stream, si la mémoire grimpait.
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    # CreateFileMappingW : ki-chat affiche son numéro de processus à côté de
    # son verrou d'instance, pour qu'un second lancement puisse le nommer —
    # et le fermer, si l'utilisateur le veut — quand il ne répond plus.
    "Win32_System_Memory",
    # CreateToolhelp32Snapshot : une instance d'avant 0.1.45 figée n'affiche
    # pas son numéro — on la retrouve par le nom de son exécutable.
    "Win32_System_Diagnostics_ToolHelp",
    # CoInitializeEx + CoCreateInstance(TaskbarList) : l'interface
    # ITaskbarList (Win32_UI_Shell) retire et remet le bouton de la barre
    # des tâches quand ki-chat se réduit dans la zone de notification.
    "Win32_System_Com",
] }
