[package]
name = "ki-client-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ki-chat"
path = "src/main.rs"

[features]
# Compteur d'allocations par image (`perf.rs`). Hors drapeau par défaut, et
# ce n'est pas de la timidité : une incrémentation atomique par allocation,
# sur une ligne de cache que se disputent le fil de l'interface, celui du
# réseau et CELUI DE L'AUDIO, coûte précisément là où il ne faut pas.
# `cargo run -p ki-client-gui --features mesures` quand on veut le chiffre.
mesures = []

[dependencies]
ki-protocol = { path = "../protocol" }
ki-voice = { path = "../voice" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.32", features = ["persistence"] }
# Chiffrement des trames du partage d'écran (clé de stream, en-tête en AAD).
chacha20poly1305 = "0.10"
ki-client-quic = { path = "../client-quic" }
# Les datagrammes voix voyagent en `Bytes` du transport jusqu'au moteur,
# sans jamais être recopiés.
bytes = "1"
ki-video = { path = "../video" }
tokio.workspace = true
chrono = "0.4"
# Poll clavier global (GetAsyncKeyState) : le push-to-talk fonctionne
# même quand la fenêtre n'a pas le focus — indispensable en jeu.
device_query = "2"
# Dialogue natif de sélection de fichier (partage de fichiers).
rfd = "0.15"
# Client HTTP bloquant pour l'upload de fichiers.
ureq = { version = "2", features = ["json"] }
# Logos de serveurs : décodage PNG/JPEG puis réencodage en vignette PNG.
# Les deux formats sont déjà tirés par eframe, aucun téléchargement en plus.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
# Vérification de la signature des mises à jour. 100 % Rust, pas de
# dépendance C : l'application remplace son propre exécutable, c'est le seul
# endroit du projet où une bibliothèque de cryptographie tierce serait un
# risque plus grand que ce qu'elle protège.
# `std` : sans lui, l'erreur du crate n'implémente pas `std::error::Error`
# et ne remonte pas par `?`. On ne prend rien d'autre — ni signature, ni
# génération de clés : ce binaire ne fait que vérifier.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# Icône, bloc de version et manifeste gravés dans l'exécutable (voir build.rs).
[build-dependencies]
winresource = "0.1"

# Coffre à secrets natif : DPAPI protège les mots de passe mémorisés avec
# une clé dérivée de la session Windows. Déjà tiré par eframe.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    # SetThreadExecutionState : pas de veille système en plein salon vocal.
    "Win32_System_Power",
    # SHQueryUserNotificationState : un jeu en plein écran exclusif ? Alors
    # l'overlay ne peut pas s'afficher, et on le dit au lieu de laisser croire.
    "Win32_UI_Shell",
    # SetWindowPos(HWND_TOPMOST) : l'overlay se remet au-dessus des jeux qui
    # se remettent eux-mêmes au-dessus ; GetForegroundWindow : qui est devant.
    "Win32_UI_WindowsAndMessaging",
    # GetPixel : la sonde de transparence de l'overlay (exemple overlay_probe)
    # lit ce que l'écran affiche vraiment ; Dwm et Controls pour la
    # transparence par le compositeur (DwmExtendFrameIntoClientArea, MARGINS).
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
] }
