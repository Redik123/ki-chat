[package]
name = "ki-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

# La boîte à outils d'interface de ki-chat, par-dessus egui : les jetons de
# design (couleurs, espacements, rayons, tailles de texte) et la mise en page
# flexbox. Faite pour servir aussi aux futures applis ki-* (ki-studio).

[dependencies]
# La version d'eframe dans ki-chat : déjà dans l'arbre.
egui = { version = "0.36", default-features = false }
# Flexbox, grille et block CSS, calculés par taffy. Caché derrière `flex` :
# si egui_taffy prend du retard sur egui, on le remplace sans toucher aux
# écrans.
egui_taffy = "0.14"
# Le mouchard des mises en page instables (versions de développement).
tracing.workspace = true
# Une icône se retient (la touche d'un Loupedeck retient la sienne).
serde.workspace = true

# Les emoji en couleur (emoji.rs) : les outils mêmes d'egui pour lire une
# police (skrifa), façonner un texte (harfrust) et peindre (vello_cpu), aux
# mêmes versions ; unicode-properties dit ce qui s'affiche en emoji.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = "0.12"
vello_cpu = { version = "0.1", default-features = false, features = ["std", "u8_pipeline"] }
unicode-segmentation = "1.13"
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }
# Le sélecteur d'emoji : la liste des emoji, leurs groupes, noms et teintes.
emojis = "0.9"

[dev-dependencies]
# Les polices d'egui, pour les tests qui mesurent du texte.
egui = { version = "0.36", features = ["default_fonts"] }
# Pour voir parler le mouchard dans les tests.
tracing-subscriber.workspace = true
# La vitrine (examples/vitrine.rs) : une fenêtre, comme ki-chat.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
# Le mode capture de la vitrine (VITRINE_CAPTURE) écrit ses pages en PNG.
png = "0.18"
