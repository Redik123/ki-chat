[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/voice",
    "crates/client-quic",
    "crates/client-cli",
    "crates/client-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Profil optimisé pour la prod : binaire compact, LTO, une seule unité de codegen
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
