[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/voice",
    "crates/video",
    "crates/ki-opus",
    "crates/client-quic",
    "crates/client-cli",
    "crates/client-gui",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Profil optimisÃ© pour la prod : binaire compact, LTO, une seule unitÃ© de codegen
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# En dev, NOS crates compilent vite (opt 0) mais toutes les DÃ‰PENDANCES sont
# optimisÃ©es : sans Ã§a, le pixel-par-pixel (egui, openh264, tract/DeepFilter)
# tourne 10-50Ã— trop lentement â€” la vidÃ©o tombait Ã  2 fps en build debug.
# CoÃ»t : une grosse compilation la premiÃ¨re fois, puis c'est en cache.
[profile.dev.package."*"]
opt-level = 3

# Le pipeline vidÃ©o lui-mÃªme touche aux pixels : optimisÃ© aussi en dev.
[profile.dev.package.ki-video]
opt-level = 3

# debug=false : avec DEBUG=true, nasm reÃ§oit des flags de dÃ©bogage qu'il
# refuse â†’ l'assembleur Ã©choue en silence et l'encodage H.264 est 4Ã— plus
# lent. Aucune perte rÃ©elle : on ne dÃ©bogue pas le C d'openh264.
[profile.dev.package.openh264-sys2]
opt-level = 3
debug = false
