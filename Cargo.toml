[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/voice",
    "crates/video",
    "crates/ki-opus",
    "crates/client-quic",
    "crates/client-cli",
    "crates/client-gui",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Profil optimisé pour la prod : binaire compact, LTO, une seule unité de codegen
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# En dev, NOS crates compilent vite (opt 0) mais toutes les DÉPENDANCES sont
# optimisées : sans ça, le pixel-par-pixel (egui, openh264, tract/DeepFilter)
# tourne 10-50× trop lentement — la vidéo tombait à 2 fps en build debug.
# Coût : une grosse compilation la première fois, puis c'est en cache.
[profile.dev.package."*"]
opt-level = 3

# Le pipeline vidéo lui-même touche aux pixels : optimisé aussi en dev.
[profile.dev.package.ki-video]
opt-level = 3

# debug=false : avec DEBUG=true, nasm reçoit des flags de débogage qu'il
# refuse → l'assembleur échoue en silence et l'encodage H.264 est 4× plus
# lent. Aucune perte réelle : on ne débogue pas le C d'openh264.
[profile.dev.package.openh264-sys2]
opt-level = 3
debug = false
