# Stack ki-chat pour Portainer (ou `docker compose up -d`).
#
# Rien à compiler : l'image est construite et publiée par GitHub Actions à
# chaque poussée sur `main`. Coller ce fichier dans Portainer → Stacks →
# Add stack → Web editor, définir KI_TOKEN dans les variables, déployer.
#
# Guide complet, y compris les trois façons de recevoir les mises à jour :
# deploy/DEPLOY-DOCKER.md

services:
  ki-chat:
    image: ghcr.io/redik123/ki-chat-server:${KI_VERSION:-latest}
    container_name: ki-chat
    restart: unless-stopped

    environment:
      # Code d'invitation : il suffit à créer un compte sur ton serveur.
      # Le `:?` fait échouer le déploiement s'il n'est pas défini — mieux vaut
      # une stack qui refuse de démarrer qu'un serveur ouvert à « changeme ».
      KI_TOKEN: ${KI_TOKEN:?définis un code d invitation dans les variables de la stack}
      # Bornes du partage de fichiers : sans elles le volume grandit jusqu'à
      # saturer le disque. 0 lève la limite correspondante.
      KI_FILES_MAX_BYTES: ${KI_FILES_MAX_BYTES:-2147483648}
      # Clé HenrikDev (fiches VALORANT). Vide : liaisons fermées, rien d'autre ne change.
      KI_HENRIK_KEY: ${KI_HENRIK_KEY:-}
      KI_FILES_TTL_DAYS: ${KI_FILES_TTL_DAYS:-30}
      # Plafond d'un fichier envoyé par morceaux (vidéos), en Mo.
      KI_FILES_MAX_FILE_MB: ${KI_FILES_MAX_FILE_MB:-512}
      # Les clips partagés ont leur stock à part : plafond et durée de vie.
      KI_CLIPS_MAX_BYTES: ${KI_CLIPS_MAX_BYTES:-8589934592}
      KI_CLIPS_TTL_DAYS: ${KI_CLIPS_TTL_DAYS:-60}
      # Les portes web (un lien vers un salon temporaire, pour des invités
      # sans compte) : l'adresse publique dont le lien est fait, et celle à
      # saisir dans ki-chat quand on offre une invitation. Sans elles, le
      # lien est relatif et l'invitation donne l'hôte de la première.
      KI_PUBLIC_URL: ${KI_PUBLIC_URL:-}
      KI_PUBLIC_QUIC: ${KI_PUBLIC_QUIC:-}
      # Certificat public (PEM) pour les navigateurs — voir « Porte web et
      # certificat public » dans le guide. Posés, le serveur ouvre une
      # seconde écoute HTTPS sur KI_TLS_PORT, relit les fichiers chaque
      # heure, et l'écoute 8080 (épinglée par les clients) ne bouge pas.
      # Vides : rien de plus.
      KI_TLS_CERT: ${KI_TLS_CERT:-}
      KI_TLS_KEY: ${KI_TLS_KEY:-}
      KI_TLS_PORT: ${KI_TLS_PORT:-8443}
      # Verbosité : info par défaut, `debug` pour enquêter.
      RUST_LOG: ${RUST_LOG:-info}

    ports:
      # QUIC : authentification, chat ET voix. C'est le port qui compte —
      # sans UDP ouvert de bout en bout, personne ne se connecte.
      - "${KI_UDP_PORT:-9987}:9987/udp"
      # HTTPS : téléchargement des fichiers partagés, et les portes web
      # (avec l'avertissement du navigateur : certificat auto-signé).
      - "${KI_HTTP_PORT:-8080}:8080/tcp"
      # Les portes web sans avertissement : l'écoute publique, derrière un
      # vrai certificat (KI_TLS_CERT / KI_TLS_KEY), publiée sur 443 pour que
      # le lien soit https://ton-domaine/salon1, sans port. À décommenter
      # une fois le certificat en place — le conteneur écoute 8443 en
      # interne (utilisateur 10001, pas de port privilégié), Docker fait 443.
      # - "443:${KI_TLS_PORT:-8443}/tcp"

    volumes:
      # Comptes (hachages Argon2id), historique, fichiers partagés, identité
      # du serveur et clé privée TLS. Volume nommé plutôt que montage d'un
      # dossier de l'hôte : le conteneur tourne en utilisateur 10001, et un
      # dossier hôte appartenant à root le ferait échouer à l'écriture.
      - ki-chat-data:/data
      # Le certificat public écrit par un sidecar certbot (guide, « Porte
      # web et certificat public ») : en lecture seule, ki-chat ne fait que
      # le lire. À décommenter avec le service certbot ci-dessous.
      # - ki-chat-tls:/data/tls:ro

    labels:
      # Seuls les conteneurs portant ce label sont mis à jour par Watchtower.
      com.centurylinklabs.watchtower.enable: "true"

  # Mise à jour automatique : Watchtower interroge GHCR toutes les 5 minutes,
  # et dès qu'une nouvelle image existe il l'installe et recrée le conteneur
  # (le volume, lui, ne bouge pas). Contrepartie assumée : il faut lui prêter
  # la socket Docker, ce qui équivaut à un accès root sur l'hôte. Si tu
  # préfères déclencher les mises à jour toi-même, supprime ce service — les
  # deux autres routes du guide ne demandent pas la socket.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: ki-chat-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"    # ne touche qu'à ki-chat
      WATCHTOWER_CLEANUP: "true"         # jette l'ancienne image
      WATCHTOWER_POLL_INTERVAL: "300"    # 5 minutes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Le certificat public des portes web, obtenu et renouvelé par certbot
  # (Let's Encrypt, défi HTTP-01 : le port 80 doit arriver à ce conteneur).
  # Il copie fullchain.pem et privkey.pem dans le volume partagé à chaque
  # délivrance ; ki-chat les relit chaque heure. À décommenter avec le
  # montage `ki-chat-tls` et le port 443 du service ki-chat, et poser
  # KI_TLS_CERT=/data/tls/fullchain.pem, KI_TLS_KEY=/data/tls/privkey.pem,
  # KI_DOMAINE et KI_ACME_MAIL dans les variables de la stack. Le guide
  # explique aussi la route « add-on Let's Encrypt » de Jelastic, sans
  # sidecar.
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: ki-chat-certbot
  #   restart: unless-stopped
  #   ports:
  #     - "80:80/tcp"
  #   volumes:
  #     - ki-chat-letsencrypt:/etc/letsencrypt
  #     - ki-chat-tls:/tls
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - >
  #       while true; do
  #         certbot certonly --standalone --non-interactive --agree-tos
  #           --keep-until-expiring -m "${KI_ACME_MAIL:?}" -d "${KI_DOMAINE:?}"
  #           --deploy-hook 'cp "$$RENEWED_LINEAGE/fullchain.pem" "$$RENEWED_LINEAGE/privkey.pem" /tls/ && chmod 644 /tls/fullchain.pem /tls/privkey.pem';
  #         sleep 12h;
  #       done

volumes:
  ki-chat-data:
  # ki-chat-tls:
  # ki-chat-letsencrypt:
