# Compile l'application de bureau pour Windows et macOS, et publie la release.
#
# C'est cette release que le client interroge au démarrage : il télécharge
# l'actif nommé exactement `ki-chat.exe` (Windows) ou `ki-chat-macos.tar.gz`
# (macOS) et compare l'étiquette du tag à la version gravée dans son binaire.
# Les deux doivent donc coïncider, sans quoi un client à jour se croirait
# indéfiniment en retard — d'où le contrôle qui ouvre chaque compilation.
#
# Quatre travaux : `windows` et `macos` compilent et déposent leurs artefacts,
# NON signés ; `signature` signe, à part ; `publish` attend tout le monde et
# crée la release d'un seul geste — deux travaux qui créeraient chacun la
# release se marcheraient dessus.
#
# Les actions sont épinglées par empreinte de commit, pas par étiquette : une
# étiquette se déplace, et elle déplacerait avec elle du code qui tourne à
# côté de la clé de signature. Dependabot propose les nouvelles empreintes.

name: release

on:
  push:
    tags: ["v*"]
  # Permet de vérifier que la chaîne complète compile sans rien publier.
  workflow_dispatch:

# Lecture seule par défaut : seul `publish` écrit, et seulement la release.
# Les travaux de compilation exécutent les scripts de build d'un millier de
# crates ; aucun n'a à pouvoir pousser dans le dépôt.
permissions:
  contents: read

env:
  # Cible explicite : les scripts de compilation restent liés dynamiquement,
  # seul l'exécutable livré prend la bibliothèque C en statique.
  TARGET: x86_64-pc-windows-msvc
  # `.cargo/config.toml` pointe vers le cmake d'une machine précise ; sans
  # `force` de son côté, celui d'ici l'emporte.
  CMAKE: cmake
  CARGO_TERM_COLOR: always
  # La chaîne Rust, épinglée : clippy tourne en `-D warnings`, et une
  # nouvelle version de Rust ne doit pas pouvoir bloquer une release d'un
  # jour à l'autre. Même version que ci.yml ; on la monte exprès.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  # Le filet, avant tout le reste. `needs: ci` en dessous fait que rien n'est
  # compilé, empaqueté ni publié tant que clippy et les tests ne sont pas
  # au vert : jusqu'ici, une release ne prouvait que la compilation.
  ci:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: ci
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Établir la version
        id: version
        shell: pwsh
        run: |
          $manifest = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $tagged = "${{ github.ref }}".StartsWith("refs/tags/")
          if ($tagged) {
            $tag = "${{ github.ref_name }}" -replace '^v', ''
            if ($tag -ne $manifest) {
              Write-Error "tag $tag mais Cargo.toml en $manifest : un client a jour se croirait perpetuellement en retard"
              exit 1
            }
          }
          "version=$manifest" >> $env:GITHUB_OUTPUT
          Write-Host "version $manifest"

      # nasm : sans lui, openh264 (partage d'écran) compile quand même mais
      # encode ~3× plus lentement — dégradation silencieuse à interdire.
      # Au choco plutôt que par l'action tierce ilammy/setup-nasm, restée
      # sur Node 20 (dernier avertissement de dépréciation de la chaîne).
      - name: Installer nasm
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      # Le cache reste : l'empoisonner supposerait d'avoir déjà compromis un
      # travail de `main`, c'est-à-dire le code lui-même. Et la clé privée
      # n'est plus ici (voir `signature`).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # La liaison statique de la bibliothèque C est déclarée dans
      # .cargo/config.toml : local et CI produisent le même binaire.
      - name: Compiler
        shell: pwsh
        run: cargo build --release --locked --target $env:TARGET -p ki-client-gui

      - name: Vérifier que le binaire est autonome
        shell: pwsh
        run: |
          # Une dépendance au redistribuable Visual C++ ne se verrait qu'à
          # l'exécution, sur le poste de quelqu'un qui n'a pas Visual Studio.
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
            Select-Object -Last 1
          if (-not $dumpbin) {
            Write-Error "dumpbin introuvable : la garantie d'autonomie ne serait pas verifiee"
            exit 1
          }
          $deps = & $dumpbin -dependents "target\$env:TARGET\release\ki-chat.exe"
          if ($deps -match 'VCRUNTIME|MSVCP') {
            Write-Error "le binaire reclame le redistribuable Visual C++"
            exit 1
          }

      - name: Construire l'installeur
        shell: pwsh
        run: |
          # L'icône est rendue par build.rs dans OUT_DIR, dont le nom porte un
          # hachage : on la retrouve au lieu de la deviner.
          $icon = Get-ChildItem target -Recurse -Filter ki-chat.ico | Select-Object -First 1
          if ($icon) { Copy-Item $icon.FullName installer\ki-chat.ico }

          $roots = @("${env:ProgramFiles(x86)}", "${env:ProgramFiles}", "$env:LOCALAPPDATA\Programs")
          $iscc = $roots | ForEach-Object { Join-Path $_ "Inno Setup 6\ISCC.exe" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\ki-chat.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Déposer les artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ki-chat-windows
          path: |
            target/x86_64-pc-windows-msvc/release/ki-chat.exe
            installer/Output/ki-chat-setup.exe

  # ---------------------------------------------------------------------
  # macOS : un exécutable universel (puces Apple et Intel dans le même
  # fichier), assemblé en `ki-chat.app`, livré archivé (c'est l'actif de
  # mise à jour) et sous forme d'assistant `.pkg`.
  #
  # Un seul coureur, Apple Silicon, compile les deux architectures : la
  # chaîne Rust sait viser l'autre, et les bibliothèques C (opus, speexdsp,
  # openh264) passent par cmake et cc, qui suivent la cible. `lipo` recolle
  # les deux tranches. Un seul actif à publier, un seul à télécharger.
  # ---------------------------------------------------------------------
  macos:
    needs: ci
    runs-on: macos-latest
    # macOS ne bloque pas la release : voir ci.yml. Sans ses actifs, la
    # release sort avec ceux de Windows.
    continue-on-error: true
    env:
      # `.cargo/config.toml` grave les chemins Windows de cmake et de nasm
      # (ceux d'une machine précise, sans `force`) : ici, ceux du PATH.
      CMAKE: cmake
      NASM: nasm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Établir la version
        id: version
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${{ github.ref_name }}"; tag="${tag#v}"
            if [[ "$tag" != "$manifest" ]]; then
              echo "::error::tag $tag mais Cargo.toml en $manifest : un client à jour se croirait perpétuellement en retard"
              exit 1
            fi
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "version $manifest"

      # nasm : sans lui, openh264 compile quand même mais encode ~3× plus
      # lentement — dégradation silencieuse à interdire. cmake est déjà sur
      # les coureurs macOS.
      - name: Installer nasm
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Compiler (puces Apple)
        run: cargo build --release --locked --target aarch64-apple-darwin -p ki-client-gui

      - name: Compiler (Intel)
        run: cargo build --release --locked --target x86_64-apple-darwin -p ki-client-gui

      - name: Recoller en exécutable universel
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/ki-chat \
            target/x86_64-apple-darwin/release/ki-chat \
            -output target/ki-chat-universal
          lipo -info target/ki-chat-universal

      - name: Construire le paquet, l'archive et l'assistant
        run: installer/macos/build-app.sh target/ki-chat-universal

      - name: Déposer les artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ki-chat-macos
          path: |
            installer/Output/ki-chat-macos.tar.gz
            installer/Output/ki-chat-macos.pkg

  # ---------------------------------------------------------------------
  # La signature, seule avec la clé.
  #
  # L'application remplace son propre exécutable : sans signature, quiconque
  # obtient le droit de publier une release exécute du code arbitraire chez
  # tout le monde. La clé publique est gravée dans le client, qui refuse
  # d'installer ce qu'il ne peut pas vérifier (deploy/SIGNATURE.md).
  #
  # Jusqu'à la 0.1.51, la signature se faisait dans les travaux de
  # compilation : la clé privée y côtoyait les scripts de build d'un millier
  # de crates et un cache restauré. Ici, rien d'autre ne tourne que le
  # signeur (`crates/signer`, une poignée de crates de cryptographie, même
  # Cargo.lock que le client qui vérifie) — pas de cache non plus.
  #
  # L'environnement `release` permet d'exiger une approbation et de limiter
  # la signature aux tags, dans les réglages du dépôt (deploy/SIGNATURE.md).
  # ---------------------------------------------------------------------
  signature:
    needs: [windows, macos]
    # Même si macOS a lâché — mais jamais sans Windows.
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefacts

      - name: Signer
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          # Sur un tag, pas de signature = pas de release : tout client depuis
          # la 0.1.12 refuserait l'actif, et depuis la 0.1.52 aussi une
          # release sans manifeste. Seul un essai manuel peut s'en passer.
          if [[ -z "$SIGNING_KEY" ]]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "::error::RELEASE_SIGNING_KEY absent : une release taguée doit être signée (deploy/SIGNATURE.md)"
              exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY absent : essai NON SIGNÉ (deploy/SIGNATURE.md)"
            exit 0
          fi
          # La clé publique que portent les clients : signer avec une autre
          # privée publierait une release que tout le monde refuserait.
          attendue=$(grep -A1 'const RELEASE_PUBKEY_HEX' crates/client-gui/src/update.rs | grep -o '[0-9a-f]\{64\}')
          if [[ -z "$attendue" ]]; then
            echo "::error::clé publique introuvable dans crates/client-gui/src/update.rs"
            exit 1
          fi
          cargo build --release --locked -p ki-signer
          signeur=target/release/ki-signer
          mkdir -p signatures
          # La signature de l'actif seul, pour les clients d'avant 0.1.52, et
          # le manifeste signé (plateforme, version, empreinte) pour les
          # suivants.
          exe=$(find artefacts -type f -name ki-chat.exe | head -1)
          if [[ -z "$exe" ]]; then
            echo "::error::ki-chat.exe introuvable dans les artefacts"
            exit 1
          fi
          "$signeur" "$exe" signatures/ki-chat.exe.sig \
            --manifeste windows "$VERSION" signatures/ki-chat.exe.manifeste --cle-attendue "$attendue"
          archive=$(find artefacts -type f -name ki-chat-macos.tar.gz | head -1)
          if [[ -n "$archive" ]]; then
            "$signeur" "$archive" signatures/ki-chat-macos.tar.gz.sig \
              --manifeste macos "$VERSION" signatures/ki-chat-macos.tar.gz.manifeste --cle-attendue "$attendue"
          else
            echo "::warning::pas d'archive macOS à signer : la release sortira sans elle"
          fi
          for f in signatures/*; do test -s "$f"; done
          ls -l signatures

      - name: Déposer les signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ki-chat-signatures
          path: signatures/
          # Un essai manuel sans clé n'en produit pas.
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # La release elle-même, une fois que tout le monde a livré.
  # ---------------------------------------------------------------------
  publish:
    needs: [windows, macos, signature]
    # `always()` : publier même si macOS a lâché — mais jamais sans Windows,
    # ni sans signatures.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' && needs.signature.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefacts

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          # Les noms sont ceux que les clients cherchent — `ki-chat.exe`,
          # `ki-chat-macos.tar.gz` — et à côté, leurs signatures et leurs
          # manifestes signés (0.1.52 et suivants ne se mettent à jour
          # qu'avec eux).
          files=$(find artefacts -type f \( -name 'ki-chat.exe' -o -name 'ki-chat.exe.sig' \
            -o -name 'ki-chat.exe.manifeste' -o -name 'ki-chat.exe.manifeste.sig' \
            -o -name 'ki-chat-setup.exe' -o -name 'ki-chat-macos.tar.gz' \
            -o -name 'ki-chat-macos.tar.gz.sig' -o -name 'ki-chat-macos.tar.gz.manifeste' \
            -o -name 'ki-chat-macos.tar.gz.manifeste.sig' -o -name 'ki-chat-macos.pkg' \))
          echo "$files"
          # Pas de release Windows sans sa signature et son manifeste.
          for requis in ki-chat.exe ki-chat.exe.sig ki-chat.exe.manifeste ki-chat.exe.manifeste.sig; do
            if ! echo "$files" | grep -q "/$requis\$"; then
              echo "::error::$requis manque : release non publiée"
              exit 1
            fi
          done
          # Le tag peut avoir été poussé après une release créée à la main.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --title "$tag" --generate-notes
          fi
