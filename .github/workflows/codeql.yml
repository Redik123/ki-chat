# CodeQL : analyse statique du code Rust, à la recherche de flux de données
# non fiables vers des endroits sensibles — un chemin de fichier venu du
# réseau, un secret dans un journal, une archive déballée sans contrôle.
#
# « Advanced setup » : ce fichier tient lieu de configuration. Ne pas
# activer en plus le « Default setup » dans les réglages du dépôt, les deux
# se marcheraient dessus.
#
# `build-mode: none` : pour Rust, CodeQL lit les sources sans compiler —
# donc sans cmake, sans nasm, sans les crates Windows, et en quelques
# minutes sur un coureur Linux. Ce qui est derrière un #[cfg(windows)] est
# lu aussi.
#
# Ce que CodeQL ne voit pas : la sûreté mémoire de l'unsafe (WASAPI, NVENC),
# et la logique du protocole — c'est le rôle du fuzzing (ci.yml, job fuzz).

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Le lundi matin : les requêtes de CodeQL évoluent même quand le code
    # ne bouge pas.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyse (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          build-mode: none
          # Les requêtes (security-extended) et ce qu'on en écarte : voir
          # le fichier, qui explique chaque exclusion.
          config-file: .github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:rust"
